services:
  _defaults:
    autowire: true
    public: false

  OxidEsales\ConsistencyCheck\ImageManager\Logger:
    class: Monolog\Logger
    factory: [ '@OxidEsales\ConsistencyCheck\ImageManager\Logger\Factory', 'create' ]

  # OXID 8.0: MonologLoggerFactory constructor changed - takes direct arguments instead of Configuration object
  OxidEsales\ConsistencyCheck\ImageManager\Logger\Factory:
    class: OxidEsales\EshopCommunity\Internal\Framework\Logger\Factory\MonologLoggerFactory
    arguments:
      $loggerName: 'Consistency Check Logger'
      $logFilePath: '%app.log_file_path%'
      $logLevel: !php/const Psr\Log\LogLevel::DEBUG

  OxidEsales\ConsistencyCheck\ImageManager\Service\UnusedImageFinderServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\UnusedImageFinderService
    arguments:
      $imageDatabaseRepository: '@OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDatabaseRepository'
      $imageDirectoryRepository: '@OxidEsales\ConsistencyCheck\ImageManager\Repository\ImageDirectoryRepository'
      $imageCollectionFactory: '@OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageCollectionFactoryInterface'
      $logger: '@OxidEsales\ConsistencyCheck\ImageManager\Logger'

  OxidEsales\ConsistencyCheck\ImageManager\Service\ImageEntityFilterServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\ImageEntityFilterService

  OxidEsales\ConsistencyCheck\ImageManager\Service\ImageManagerServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\ImageManagerService
    arguments:
      $logger: '@OxidEsales\ConsistencyCheck\ImageManager\Logger'

  OxidEsales\ConsistencyCheck\ImageManager\Service\LogReaderInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\FileLogReader
    arguments:
      $logFilePath: '%app.log_file_path%'

  OxidEsales\ConsistencyCheck\ImageManager\Service\ImageUsageCheckerInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\ImageUsageChecker

  OxidEsales\ConsistencyCheck\ImageManager\Service\PostCommandLoggerInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\VerboseConsoleLogReporter
    arguments:
      $formatter: '@OxidEsales\ConsistencyCheck\Shared\Service\MessageFormatterServiceInterface'

  # OXID 8.0 Media Unused Image Finder
  OxidEsales\ConsistencyCheck\ImageManager\Service\MediaUnusedImageFinderServiceInterface:
    class: OxidEsales\ConsistencyCheck\ImageManager\Service\MediaUnusedImageFinderService
    arguments:
      $mediaDatabaseRepository: '@OxidEsales\ConsistencyCheck\ImageManager\Repository\MediaImageDatabaseRepository'
      $mediaDirectoryRepository: '@OxidEsales\ConsistencyCheck\ImageManager\Repository\MediaImageDirectoryRepository'
      $imageCollectionFactory: '@OxidEsales\ConsistencyCheck\ImageManager\Factory\ImageCollectionFactoryInterface'
      $logger: '@OxidEsales\ConsistencyCheck\ImageManager\Logger'
