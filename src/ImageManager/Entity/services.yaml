  # # Category Image Entities
  oxid_esales.consistency_check.entity.image_entity.category.oxthumb:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Category'
      $table: 'oxcategories'
      $fieldName: 'OXTHUMB'
      $directory: /out/pictures/master/category/thumb
    tags: ['oe.consistency_check.image_entity']

  oxid_esales.consistency_check.entity.image_entity.category.oxicon:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Category'
      $table: 'oxcategories'
      $fieldName: 'OXICON'
      $directory: /out/pictures/master/category/icon
    tags: ['oe.consistency_check.image_entity']

  oxid_esales.consistency_check.entity.image_entity.category.oxpromoicon:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Category'
      $table: 'oxcategories'
      $fieldName: 'OXPROMOICON'
      $directory: /out/pictures/master/category/promo_icon
    tags: ['oe.consistency_check.image_entity']

  # Manufacturer Image Entities

  oxid_esales.consistency_check.entity.image_entity.manufacturer.oxicon:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Manufacturer'
      $table: 'oxmanufacturers'
      $fieldName: 'OXICON'
      $directory: /out/pictures/master/manufacturer/icon
    tags: ['oe.consistency_check.image_entity']

  oxid_esales.consistency_check.entity.image_entity.manufacturer.oxpicture:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Manufacturer'
      $table: 'oxmanufacturers'
      $fieldName: 'OXPICTURE'
      $directory: /out/pictures/master/manufacturer/picture
    tags: ['oe.consistency_check.image_entity']

  oxid_esales.consistency_check.entity.image_entity.manufacturer.oxpromotion_icon:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Manufacturer'
      $table: 'oxmanufacturers'
      $fieldName: 'OXPROMOTION_ICON'
      $directory: /out/pictures/master/manufacturer/promo_icon
    tags: ['oe.consistency_check.image_entity']

  oxid_esales.consistency_check.entity.image_entity.manufacturer.oxthumbail:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\ImageEntity
    arguments:
      $name: 'Manufacturer'
      $table: 'oxmanufacturers'
      $fieldName: 'OXTHUMBNAIL'
      $directory: /out/pictures/master/manufacturer/thumb
    tags: ['oe.consistency_check.image_entity']

  # ======================================================================
  # OXID 8.0 Media System Entities (Auto-generated)
  # Replaces legacy OXPIC1-12 field-based entities
  # ======================================================================
  # OXID 8.0 Media-based Product Images
  # Replaces legacy OXPIC1-12 field entities
  oxid_esales.consistency_check.entity.media_image_entity.product:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\MediaImageEntity
    arguments:
      $name: 'ProductMedia'
      $mediaType: 'product'
    tags: ['oe.consistency_check.media_image_entity']

  # Product Thumbnail (via media roles)
  oxid_esales.consistency_check.entity.media_role_image_entity.product.thumbnail:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\MediaRoleImageEntity
    arguments:
      $name: 'ProductThumbnail'
      $mediaType: 'product'
      $role: 'thumbnail'
    tags: ['oe.consistency_check.media_image_entity']

  # Product Icon (via media roles)
  oxid_esales.consistency_check.entity.media_role_image_entity.product.icon:
    class: OxidEsales\ConsistencyCheck\ImageManager\Entity\MediaRoleImageEntity
    arguments:
      $name: 'ProductIcon'
      $mediaType: 'product'
      $role: 'icon'
    tags: ['oe.consistency_check.media_image_entity']
